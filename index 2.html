<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왓슈 패밀리</title>
<style>
  @font-face { font-family: "Jua"; src: url("img/jua-sub.woff2") format("woff2"); font-display: block; }
  :root {
    --sky: #8fd6f2;
    --ink: #5a3a1e;
    --blue: #0f9ad8;
    --orange: #f39321;
    --green: #6cbb3c;
    --pink: #e8559b;
    --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    background: var(--sky);
    font-family: var(--font);
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  img { -webkit-user-drag: none; user-drag: none; }

  /* ---------- 화면 전환 ---------- */
  .view { position: fixed; inset: 0; opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s .45s; }
  .view.on { opacity: 1; visibility: visible; transition: opacity .45s ease; }

  /* ---------- 메인 ---------- */
  #main { overflow: hidden; }
  #main .backdrop {
    position: absolute; inset: -40px;
    background: center / cover no-repeat;
    filter: blur(24px) saturate(1.1);
  }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 2000px; height: 1125px;
    transform-origin: 0 0;
    overflow: hidden;
  }
  #stage img { position: absolute; display: block; height: auto; pointer-events: none; }
  #stage .layer { position: absolute; inset: 0; pointer-events: none; }
  #stage.pointer { cursor: pointer; }

  .clouds { animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }

  .sway { transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }

  .spin { animation: spin 16s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 건물에 올렸을 때만 보이는 장식 */
  .bldg-only { opacity: 0; transform: scale(.6); transition: opacity .35s ease, transform .45s cubic-bezier(.3,1.6,.5,1); }
  #stage.bldg .bldg-only { opacity: 1; transform: scale(1); }
  #bubbleB { transform-origin: 50% 0; }

  #building { transition: transform .45s cubic-bezier(.3,1.5,.5,1); transform-origin: 50% 80%; }
  #stage.bldg #building { transform: scale(1.04); }

  /* 캐릭터 */
  .char { transition: transform .6s cubic-bezier(.35,1.25,.5,1); }
  .float { animation: float 3.6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .char .def, .char .hov { transition: opacity .18s ease, transform .35s cubic-bezier(.3,1.6,.5,1); }
  .char .hov { opacity: 0; transform: scale(.94); }
  .char.hover .def { opacity: 0; }
  .char.hover .hov { opacity: 1; transform: scale(1.03); }
  .char .say { opacity: 0; transform: translateY(16px) scale(.7); transition: opacity .2s ease, transform .4s cubic-bezier(.3,1.7,.5,1); }
  .char.hover .say { opacity: 1; transform: none; }

  #logo { animation: bob 5s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes bob { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1.2deg) translateY(-6px); } }

  /* 전체화면 버튼 */
  .fs-btn {
    position: fixed; right: 16px; bottom: 16px; z-index: 50;
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.85); color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    cursor: pointer; display: grid; place-items: center;
    opacity: 0; transition: opacity .4s;
  }
  body.awake .fs-btn { opacity: 1; }
  .fs-btn svg { width: 22px; height: 22px; }

  /* ---------- 하위 화면 공통 ---------- */
  .page { overflow-y: auto; overflow-x: hidden; background: #fffdf6; }
  .page-inner { max-width: 1180px; margin: 0 auto; padding: 16px 24px 96px; }
  /* 스크롤해도 위에 붙어 있는 상단 바 */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255, 253, 246, .88);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: box-shadow .25s ease;
  }
  .topbar.scrolled { box-shadow: 0 2px 12px rgba(90, 58, 30, .12); }
  .topbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .home-btn img { transition: width .25s ease; }
  .topbar.scrolled .home-btn img { width: 96px; }
  .home-btn { border: 0; background: none; padding: 0; cursor: pointer; }
  .home-btn img { width: 150px; display: block; }
  .back-btn {
    font: inherit; font-size: 20px; color: #fff; background: var(--blue);
    border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
    box-shadow: 0 4px 0 #0b78aa;
  }
  .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b78aa; }

  /* ---------- 캐릭터 소개 (PDF 한 장 = 16:9 슬라이드 한 칸) ---------- */
  #charPage { background: #fff; scroll-behavior: smooth; }
  .slide { position: relative; width: 100%; height: calc(var(--k, .5) * 1125px); overflow: hidden; background: center / 100% 100% no-repeat; }
  .slide .st { position: absolute; left: var(--sl, 0px); top: 0; width: 2000px; height: 1125px; transform-origin: 0 0; transform: scale(var(--k, .5)); }
  /* 아이폰 가로 화면의 노치 쪽 여백을 재기 위한 보이지 않는 상자 */
  #safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .st > * { position: absolute; display: block; }
  .st img { height: auto; pointer-events: none; }
  .st .bg { width: 2000px !important; height: 1125px; object-fit: cover; }
  .st .fill { inset: 0; }
  .st .dash { left: 0; width: 2000px; height: 4px; background: repeating-linear-gradient(90deg, #fff 0 16px, transparent 16px 25px); background-position: -8px 0; }
  .st .ellipse { border-radius: 50%; filter: blur(10px); opacity: .85; animation: shadow 3.6s ease-in-out infinite; }
  .st .caption-box { background: #95d0f0; }
  .st .blur { filter: blur(6px); opacity: .6; }

  .st .hero { animation: heroFloat 3.6s ease-in-out infinite; }
  @keyframes heroFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -22px; } }
  .st .shadow { animation: shadow 3.6s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .85; } 50% { transform: scaleX(.86); opacity: .6; } }
  .st .twinkle { animation: twinkle 3s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 1; } to { opacity: .55; } }
  .st .beat { animation: beat 1.2s ease-in-out infinite; transform-origin: 50% 60%; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.35); } 30% { transform: scale(1); } 45% { transform: scale(1.2); } }

  /* 스크롤해서 화면에 들어오면 등장 */
  .st .pop, .st .title, .st .grid, .st .turn, .st .tag, .st .comic, .st .sticker, .st .relmap {
    opacity: 0; transition: opacity .6s ease, transform .7s cubic-bezier(.3,1.4,.5,1);
  }
  .st .pop { transform: scale(.6) translateY(20px); transform-origin: 20% 100%; }
  .st .title, .st .grid, .st .comic, .st .relmap { transform: translateY(40px); }
  .st .turn { transform: translateX(-60px); }
  .st .tag { transform: translateX(-30px) rotate(-6deg); }
  .st .sticker { transform: translateY(50px) scale(.9); }
  .slide.in .pop, .slide.in .title, .slide.in .grid, .slide.in .turn, .slide.in .tag, .slide.in .comic, .slide.in .relmap { opacity: 1; transform: none; }
  .slide.in .sticker { opacity: 1; transform: none; }
  .slide.in .sticker:nth-of-type(2n) { transition-delay: .1s; }
  .st .sticker, .st .rel, .st .building { pointer-events: auto; cursor: pointer; }
  .slide.in .sticker:hover { transform: rotate(-4deg) scale(1.08); transition-delay: 0s; transition-duration: .3s; }
  .st .rel, .st .building { transition: transform .3s cubic-bezier(.3,1.6,.5,1), filter .3s; }
  .st .rel:hover { transform: scale(1.08); filter: drop-shadow(0 8px 14px rgba(0,0,0,.18)); }
  .st .building:hover { transform: scale(1.05) translateY(-4px); }
  /* 관계도: 캐릭터에 올리면 메인 화면과 같은 말풍선 */
  .st .rel-say { opacity: 0; transform: translateY(16px) scale(.7); transform-origin: 10% 100%; pointer-events: none;
    transition: opacity .2s ease, transform .4s cubic-bezier(.3,1.7,.5,1); }
  .st .rel-say.on { opacity: 1; transform: none; }
  /* 건물에 올리면 위의 "일로 올겨?" 말풍선이 통통 */
  .st .bldg-say { transform-origin: 50% 100%; }
  .slide.in .st.bhover .bldg-say { transform: scale(1.3) translateY(-10px); transition-duration: .35s; }

  /* 캐릭터 페이지 떠 있는 메뉴 (스크롤해도 항상 오른쪽 위) */
  .cnav {
    position: sticky; top: 0; z-index: 10; height: 0;
    display: flex; justify-content: flex-end; padding: 0 max(16px, env(safe-area-inset-right)) 0 16px;
  }
  .cnav-in {
    margin-top: 14px; display: flex; align-items: center; gap: 6px; padding: 6px;
    background: rgba(255,255,255,.82); border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); height: max-content;
  }
  .cnav .back-btn {
    height: 46px; padding: 0 20px; font-size: 18px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -4px 0 rgba(0, 60, 100, .25);
  }
  .cnav .back-btn { transition: transform .2s cubic-bezier(.3,1.6,.5,1), background-color .2s; }
  .cnav .back-btn:hover { background: #2aa9e6; transform: translateY(-2px) scale(1.04); }
  .cnav .back-btn:active { transform: scale(.96); box-shadow: inset 0 -2px 0 rgba(0, 60, 100, .25); }
  .cnav .mini { width: 46px; height: 46px; padding: 0; border: 3px solid transparent; border-radius: 50%; background: none; cursor: pointer; overflow: hidden; transition: transform .2s; }
  .cnav .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cnav .mini:hover { transform: scale(1.1); }
  .cnav .mini.me { border-color: var(--blue); }

  /* 지도 */
  /* ---------- 관광지도 (16:9 한 화면, 버튼으로 세 가지 상태: a 처음 / b 관광 12선 / c 스탬프 투어) ---------- */
  #mapPage { overflow: hidden; background: #fdeec0; }
  #mapPage .mbg { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity .7s ease; }
  #mapPage[data-mode="a"] .mbg.a, #mapPage[data-mode="b"] .mbg.b, #mapPage[data-mode="c"] .mbg.c { opacity: 1; }
  #mstage { position: absolute; left: 0; top: 0; width: 2000px; height: 1125px; transform-origin: 0 0; }
  #mstage > *, #mgroup > * { position: absolute; display: block; }
  #mstage img { height: auto; }
  #mstage .cloud { animation: drift 14s ease-in-out infinite alternate; pointer-events: none; }
  #mstage .fade-char { animation: float 4s ease-in-out infinite; transition: opacity .5s ease; pointer-events: none; }
  #mapPage:not([data-mode="a"]) .fade-char { opacity: 0; }

  #mgroup { left: 0; top: 0; width: 1895px; height: 2384px; transform-origin: 0 0; transition: transform .9s cubic-bezier(.6,0,.2,1); }
  #mgroup .mi { translate: -50% -50%; cursor: pointer; transform-origin: 50% 85%;
    transition: opacity .45s ease, transform .35s cubic-bezier(.3,1.6,.5,1), filter .3s; }
  #mgroup .mi:hover, #mgroup .mi.hl { transform: scale(1.35) translateY(-14px); z-index: 5;
    filter: drop-shadow(0 0 18px #fff) drop-shadow(0 14px 18px rgba(0,0,0,.25)); }
  #mapPage[data-mode="b"] .mi.no-b, #mapPage[data-mode="c"] .mi:not(.stamp) { opacity: 0; transform: scale(.5); pointer-events: none; }
  #mgroup .pin { width: 56px; height: 76px; translate: -50% -100%; transition: opacity .4s; pointer-events: none; z-index: 4; }
  #mgroup .pin svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #mapPage[data-mode="b"] .pin { opacity: 0; }
  #mapPage[data-mode="c"] .pin { animation: pinBob 1.6s ease-in-out infinite; }
  #mgroup .pin.hl { animation: pinJump .6s ease-in-out infinite !important; }
  @keyframes pinBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pinJump { 0%,100% { transform: translateY(0) scale(1.2); } 50% { transform: translateY(-34px) scale(1.3); } }
  #mgroup .route { left: 0; top: 0; width: 1895px; height: 2384px; pointer-events: none; opacity: 0; transition: opacity .5s ease .4s; }
  #mapPage[data-mode="c"] .route { opacity: 1; }
  #mgroup .route .trail { fill: none; stroke: #ef4b2f; stroke-width: 13; stroke-linecap: round; stroke-dasharray: 34 24; animation: march 1.4s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -58; } }

  .mbtn { cursor: pointer; transition: transform .25s cubic-bezier(.3,1.6,.5,1), filter .25s; transform-origin: 50% 50%; }
  .mbtn:hover { transform: scale(1.06) translateY(-3px); }
  .mbtn.on { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 4px #fff); transform: scale(1.06); }
  #mapPage[data-mode="a"] .mbtn { animation: nudge 2.4s ease-in-out infinite; }
  #mapPage[data-mode="a"] .mbtn + .mbtn { animation-delay: .25s; }
  @keyframes nudge { 0%,80%,100% { transform: none; } 88% { transform: scale(1.07) rotate(-2deg); } 94% { transform: scale(1.03) rotate(1.5deg); } }

  .mcard { opacity: 0; transform: translateX(-140px); pointer-events: none; transition: opacity .5s ease, transform .8s cubic-bezier(.3,1.2,.4,1); }
  #mapPage[data-mode="b"] #card12, #mapPage[data-mode="c"] #cardStamp { opacity: 1; transform: none; pointer-events: auto; transition-delay: .25s; }
  .mcard > img { position: absolute; left: 0; top: 0; width: 100%; height: auto; }
  /* 관광 12선: 타일에 올리면 흰 테두리와 함께 타일이 살짝 커짐 (지도 위 같은 장소도 같이) */
  .mcard .hot { position: absolute; cursor: pointer; }
  #card12 .hot { border-radius: 25px; overflow: hidden;
    transition: transform .3s cubic-bezier(.3,1.6,.5,1), box-shadow .2s; }
  #card12 .hot .zoom { position: absolute; inset: 0; background-repeat: no-repeat; opacity: 0; transition: opacity .1s; }
  #card12 .hot:hover, #card12 .hot.tap { z-index: 2; transform: scale(1.07); box-shadow: 0 0 0 5px #fff, 0 10px 18px rgba(0,0,0,.2); }
  #card12 .hot:hover .zoom, #card12 .hot.tap .zoom { opacity: 1; }
  #mapPage .cnav { position: absolute; top: 0; right: 0; height: auto; }

  /* 캐릭터 소개 첫 장: 아래로 스크롤 안내 */
  .scroll-hint {
    position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; height: max(130px, calc(var(--k, .5) * 220px));
    background: linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,.22) 55%, rgba(0,0,0,0));
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px;
    opacity: 0; pointer-events: none; transition: opacity .6s ease;
  }
  .scroll-hint button { border: 0; padding: 0; background: none; cursor: pointer; width: max(180px, calc(var(--k, .5) * 330px)); }
  .scroll-hint img { width: 100%; display: block; }
  .scroll-hint.bob button { animation: hintFloat 3.6s ease-in-out infinite; }   /* 큰 캐릭터와 같은 주기·높이로 둥실 */
  @keyframes hintFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 calc(var(--k, .5) * -22px); } }
  #charPage.hint-on .scroll-hint { opacity: 1; }
  #charPage.hint-on .scroll-hint button { pointer-events: auto; }

  @media (max-width: 720px) {
    .cnav .back-btn { height: 34px; font-size: 14px; padding: 0 12px; }
    .cnav .mini { width: 34px; height: 34px; }
    .home-btn img { width: 110px; }
  }
  /* ---------- 휴대폰을 세로로 들었을 때: 가로로 돌려 달라는 안내 ---------- */
  #rotate { display: none; position: fixed; inset: 0; z-index: 100; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px 16px; text-align: center; overflow: hidden;
    background: linear-gradient(#bfe8f8, #fdf6c9 60%, #d9ee8a); }
  #rotate .chars { display: flex; gap: 6px; justify-content: center; }
  #rotate .chars img { width: 21vw; max-width: 110px; animation: float 3.6s ease-in-out infinite; }
  #rotate .chars img:nth-child(2) { animation-delay: -.9s; }
  #rotate .chars img:nth-child(3) { animation-delay: -1.8s; }
  #rotate .chars img:nth-child(4) { animation-delay: -2.7s; }
  #rotate .phone { width: 86px; height: 86px; animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 20% { transform: rotate(0); } 50%, 75% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  #rotate h2 { margin: 0; font: 34px/1.2 var(--font); color: #e8559b; text-shadow: 0 3px 0 #fff; }
  #rotate p { margin: 0; font: 19px/1.5 var(--font); color: var(--ink); }
  #rotate button { margin-top: 6px; font: 16px var(--font); color: #7a6a58; background: rgba(255,255,255,.7);
    border: 0; border-radius: 999px; padding: 10px 18px; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate:not(.skip) { display: flex; }
  }

  /* ---------- 가로로 든 휴대폰 (화면 높이가 낮을 때) ---------- */
  @media (max-height: 520px) {
    .cnav { padding: 0 max(10px, env(safe-area-inset-right)) 0 10px; }
    .cnav-in { margin-top: 8px; gap: 4px; padding: 4px; }
    .cnav .mini { width: 32px; height: 32px; border-width: 2px; }
    .cnav .back-btn { height: 32px; font-size: 13px; padding: 0 12px; }
    .scroll-hint { height: 90px; padding-bottom: 8px; }
    .scroll-hint button { width: 150px; }
    .fs-btn { width: 36px; height: 36px; right: 10px; bottom: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- ================= 1·2. 메인 화면 ================= -->
<section id="main" class="view on" aria-label="메인">
  <div class="backdrop" style="background-image:url('img/L1.webp')"></div>
  <div id="stage"></div>
</section>

<!-- ================= 3. 캐릭터 소개 ================= -->
<section id="charPage" class="view page" aria-label="캐릭터 소개">
  <nav class="cnav">
    <div class="cnav-in">
      <button class="back-btn" data-go="">처음으로</button>
    </div>
  </nav>
  <div id="slides"></div>
</section>

<!-- ================= 4. 관광지도 ================= -->
<section id="mapPage" class="view" aria-label="관광지도" data-mode="a">
  <div class="mbg a" style="background-image:url('img/map/bg_a.webp')"></div>
  <div class="mbg b" style="background-image:url('img/map/bg_b.webp')"></div>
  <div class="mbg c" style="background-image:url('img/map/bg_c.webp')"></div>
  <div id="mstage"></div>
  <nav class="cnav">
    <div class="cnav-in">
      <button class="back-btn" data-go="">처음으로</button>
    </div>
  </nav>
</section>

<div id="safe"></div>
<div id="rotate" role="dialog" aria-label="가로로 돌려서 보기 안내">
  <div class="chars" id="rotateChars"></div>
  <svg class="phone" viewBox="0 0 86 86" aria-hidden="true">
    <rect x="25" y="8" width="36" height="70" rx="8" fill="#fff" stroke="#5a3a1e" stroke-width="4"/>
    <rect x="31" y="17" width="24" height="48" rx="3" fill="#8fd6f2"/>
    <circle cx="43" cy="71" r="2.6" fill="#5a3a1e"/>
  </svg>
  <h2>가로로 돌려서 보슈~!</h2>
  <p>휴대폰을 옆으로 눕히면<br>왓슈? 패밀리가 기다려유</p>
  <button id="rotateSkip">그냥 세로로 볼래요</button>
</div>

<button class="fs-btn" id="fsBtn" aria-label="전체화면">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>

/* ---- 화면 크기에 맞추기 (16:9 전체가 보이도록, 아이폰 노치 여백은 피해서) ---- */
function safe() {
  const cs = getComputedStyle(document.getElementById('safe'));
  return { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0, t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
}
function fitBox() {
  const s = safe(), W = innerWidth - s.l - s.r, H = innerHeight - s.t - s.b;
  const k = Math.min(W / 2000, H / 1125);
  return { k, x: s.l + (W - 2000 * k) / 2, y: s.t + (H - 1125 * k) / 2 };
}
function fit() {
  const { k, x, y } = fitBox();
  stage.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
  stage.dataset.k = k;
}
addEventListener('resize', fit);

/* 마지막으로 누른 게 손가락(touch)인지 마우스인지 */
let lastPointer = 'mouse';

/* ---- 투명한 부분은 무시하고 그림 모양대로 마우스 인식 ---- */
const alphaCache = new Map();
function alphaOf(img) {
  if (alphaCache.has(img.src)) return alphaCache.get(img.src);
  if (!img.complete || !img.naturalWidth) return null;
  const S = 4;
  const w = Math.ceil(img.naturalWidth / S), h = Math.ceil(img.naturalHeight / S);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  let data;
  try { data = ctx.getImageData(0, 0, w, h).data; } catch (e) { data = null; }
  const a = { w, h, data };
  alphaCache.set(img.src, a);
  return a;
}
function toLocal(el, px, py) {
  // 무대 좌표 → el 좌표 (부모 레이어들의 transform 역산)
  const chain = [];
  for (let n = el; n && n !== stage; n = n.parentElement) chain.unshift(n);
  let p = new DOMPoint(px, py);
  for (const n of chain) {
    const cs = getComputedStyle(n);
    if (cs.transform && cs.transform !== 'none') {
      const [ox, oy] = cs.transformOrigin.split(' ').map(parseFloat);
      const ol = n.offsetLeft, ot = n.offsetTop;
      const m = new DOMMatrix().translate(ol + ox, ot + oy).multiply(new DOMMatrix(cs.transform)).translate(-(ol + ox), -(ot + oy));
      p = m.inverse().transformPoint(p);
    }
  }
  return p;
}
function hits(img, px, py) {
  const p = toLocal(img, px, py);
  const x = p.x - img.offsetLeft, y = p.y - img.offsetTop;
  const w = img.offsetWidth, h = img.offsetHeight;
  if (x < 0 || y < 0 || x >= w || y >= h) return false;
  const a = alphaOf(img);
  if (!a || !a.data) return true; // 판별 불가하면 사각형으로
  const ix = Math.floor(x / w * a.w), iy = Math.floor(y / h * a.h);
  return a.data[(iy * a.w + ix) * 4 + 3] > 60;
}

let hoverTarget = null; // 'bldg' | char index | null
function pick(px, py) {
  for (let i = CHARS.length - 1; i >= 0; i--) {
    const c = CHARS[i];
    const shown = c.wrap.classList.contains('hover') ? c.hovEl : c.defEl;
    if (hits(shown, px, py) || hits(c.defEl, px, py)) return i;
  }
  if (hits(building, px, py)) return 'bldg';
  return null;
}
function setHover(t) {
  if (t === hoverTarget) return;
  hoverTarget = t;
  stage.classList.toggle('pointer', t !== null);
  stage.classList.toggle('bldg', t === 'bldg');
  CHARS.forEach((c, i) => {
    c.wrap.classList.toggle('hover', t === i);
    const a = c.away;
    c.wrap.style.transform = t === 'bldg' ? `translate(${a.x}px, ${a.y}px) rotate(${a.r}deg) scale(${a.s})` : '';
  });
}
function stagePoint(e) {
  const r = stage.getBoundingClientRect();
  const k = +stage.dataset.k;
  return [(e.clientX - r.left) / k, (e.clientY - r.top) / k];
}
const main = document.getElementById('main');
main.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  setHover(pick(...stagePoint(e)));
});
main.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') setHover(null); });
main.addEventListener('click', e => {
  const t = pick(...stagePoint(e));
  // 휴대폰: 한 번 누르면 마우스를 올린 것처럼 보여 주고, 같은 곳을 한 번 더 누르면 이동
  if (lastPointer === 'touch' && t !== hoverTarget) { setHover(t); return; }
  if (t === 'bldg') go('map');
  else if (t !== null) go('c/' + CHARS[t].key);
});

/* ---- 화면 이동 ---- */
const views = { main: document.getElementById('main'), char: document.getElementById('charPage'), map: document.getElementById('mapPage') };
function go(route) { location.hash = route ? '#' + route : ''; if (!route) render(); }
function render() {
  const h = location.hash.replace(/^#\/?/, '');
  let v = 'main', ready = null;
  if (h.startsWith('c/')) {
    const c = CHARS.find(c => c.key === h.slice(2));
    if (c) { v = 'char'; ready = fillChar(c); }
  } else if (h === 'map') v = 'map';
  const show = () => Object.entries(views).forEach(([k, el]) => el.classList.toggle('on', k === v));
  // 첫 장 그림이 다 준비된 뒤에 한 번에 보여 주기 (최대 1.5초 대기)
  if (ready) Promise.race([ready, new Promise(r => setTimeout(r, 1500))]).then(show);
  else show();
  if (v === 'map') document.querySelectorAll('.cnav .mini').forEach(b => b.classList.remove('me'));
  if (v !== 'main') { views[v].scrollTop = 0; views[v].querySelector('.topbar')?.classList.remove('scrolled'); setHover(null); }
  if (v === 'char') requestAnimationFrame(fitSlides);
  if (v === 'map') { setMode('a'); fitMap(); }
}
addEventListener('hashchange', render);

  const bar = pg.querySelector('.topbar');
  if (bar) pg.addEventListener('scroll', () => bar.classList.toggle('scrolled', pg.scrollTop > 8));

const slideObserver = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) e.target.classList.add('in');
}), { root: charPage, threshold: .35 });

function fitSlides() {
  const s = safe();
  charPage.style.setProperty('--k', (slidesEl.clientWidth - s.l - s.r) / 2000);

/* 아래로 스크롤 안내: 처음엔 1.2초 뒤 나타남 → 스크롤하면 사라짐 → 스크롤이 2.5초 멈췄는데

const hint = document.createElement('div');

  const next = [...slidesEl.children].find(sl => sl.offsetTop > charPage.scrollTop + 10);
  if (next) charPage.scrollTo({ top: next.offsetTop, behavior: 'smooth' });
});
let hintTimer;
const nearBottom = () => charPage.scrollTop + charPage.clientHeight > charPage.scrollHeight - 200;
function showHintLater(ms) {
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { if (views.char.classList.contains('on') && !nearBottom()) charPage.classList.add('hint-on'); }, ms);
}
function resetHint() {
  charPage.classList.remove('hint-on');
  hint.classList.remove('bob'); void hint.offsetWidth; hint.classList.add('bob'); // 캐릭터와 같은 순간에 시작 → 박자 맞음
  showHintLater(1200);
}
charPage.addEventListener('scroll', () => {
  charPage.classList.remove('hint-on');
  showHintLater(2500);
});

let shownChar = null;
function fillChar(c) {
  document.querySelectorAll('.cnav .mini').forEach(b => b.classList.toggle('me', b.dataset.key === c.key));
  if (shownChar === c.key) { resetHint(); return Promise.resolve(); }
  shownChar = c.key;
  slidesEl.innerHTML = '';
  PAGES[c.key].forEach((items, si) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    const bgItem = items.find(it => it.cls === 'bg' || it.box === 'fill');
    if (bgItem && bgItem.box) slide.style.backgroundColor = bgItem.color;
    else if (bgItem) slide.style.backgroundImage = `url("${IMG[bgItem.src]}")`;
    else slide.style.backgroundColor = '#fff';
    const st = document.createElement('div');
    st.className = 'st';
    slide.appendChild(st);
    let n = 0;
    items.forEach(it => {
      let el;
      if (it.box) {
        el = document.createElement('div');
        if (it.box === 'fill') { el.className = 'fill'; el.style.background = it.color; }
        else if (it.box === 'dash') { el.className = 'dash'; el.style.top = it.y + 'px'; }
        else if (it.box === 'ellipse') { el.className = 'ellipse'; el.style.background = it.color; }
        else if (it.box === 'caption') { el.className = 'caption-box'; }
        if (it.x != null) Object.assign(el.style, { left: it.x + 'px', top: it.y + 'px', width: it.w + 'px', height: it.h + 'px' });
      } else {
        el = new Image();
        el.src = IMG[it.src];
        el.alt = '';
        el.decoding = 'async';
        Object.assign(el.style, { left: it.x + 'px', top: it.y + 'px', width: it.w + 'px' });
        if (it.cls) el.className = it.cls;
        if (it.rot) el.style.rotate = it.rot + 'deg';
        if (/spin|sway/.test(it.cls || '')) el.style.animationDelay = (-Math.random() * 8).toFixed(2) + 's';
        if (it.cls === 'sticker') el.style.transitionDelay = (n++ * .12) + 's';
        if (it.go) {
          const show = () => it.go === 'map' ? st.classList.add('bhover') : showSay(st, el, it.go);
          const hide = () => { st.classList.remove('bhover'); hideSay(st); };
          el.addEventListener('click', e => {
            e.stopPropagation();
            // 휴대폰: 처음 누르면 말풍선만, 같은 걸 한 번 더 누르면 이동
            if (lastPointer === 'touch' && st.armed !== el) { hide(); st.armed = el; show(); return; }
            go(it.go === 'map' ? 'map' : 'c/' + it.go);
          });
          el.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') show(); });
          el.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') hide(); });
          if (!st.armedReset) { st.armedReset = true; st.addEventListener('click', () => { st.armed = null; hide(); }); }
        }
      }
      st.appendChild(el);
    });
    slidesEl.appendChild(slide);
    slideObserver.observe(slide);
  });
  fitSlides();
  resetHint();
  const first = [...slidesEl.querySelectorAll('.slide:first-child img')];
  return Promise.all(first.map(im => im.decode ? im.decode().catch(() => {}) : null));
}
/* 관계도 말풍선 자리: 캐릭터 동그라미 크기 대비 비율 (말풍선 왼쪽 위 기준)
   윗줄(잇슈·햇슈)은 오른쪽 위 메뉴에 가리지 않게 머리 오른쪽 옆에 붙임 */
const SAY_POS = { blue: [.78, .06], duck: [.76, .04], owl: [.6, -.36], lotus: [.6, -.24] };
function showSay(st, el, key) {
  // 메인 화면 말풍선 이미지(햇슈~? / 잇슈~? / 쉬슈~~ / 오슈~!)를 캐릭터 오른쪽 위에
  const [id, , , w] = CHARS.find(c => c.key === key).say;
  let say = st.querySelector('.rel-say');
  if (!say) { say = new Image(); say.className = 'rel-say'; say.alt = ''; st.appendChild(say); }
  say.src = IMG[id];
  say.style.width = w + 'px';
  const [fx, fy] = SAY_POS[key];
  say.style.left = (el.offsetLeft + el.offsetWidth * fx) + 'px';
  say.style.top = (el.offsetTop + el.offsetHeight * fy) + 'px';
  say.classList.remove('on');
  void say.offsetWidth; // 다시 올릴 때마다 튀어나오는 효과
  say.classList.add('on');
}
function hideSay(st) { const t = st.querySelector('.rel-say'); if (t) t.classList.remove('on'); }

/* ---- 관광지도 ---- */
const mapPage = document.getElementById('mapPage');
const mstage = document.getElementById('mstage');
/* 지도 안 좌표 (지도 그림 1895×2384 기준): [가운데 x, 가운데 y, 폭] — 목업과 맞춰서 얻은 값 */
const SPOTS = {
  gongseri: [689, 221, 256], pinnacle: [821, 424, 222], spavis: [1121, 531, 249], yeonginsan: [1033, 765, 376],
  hyeonchungsa: [1448, 875, 456], gokgyo: [1123, 951, 368], market: [911, 1075, 200], museum: [1387, 1078, 449],
  jijunghae: [1599, 1124, 210], onyang: [1121, 1153, 200], dogo: [555, 1226, 288], flower: [333, 1378, 215],
  sinjeongho: [1084, 1356, 310], oeam: [1370, 1646, 288], bonggoksa: [1060, 1878, 290],
};
/* 스탬프 투어 6곳: 핀 끝 위치와 색 (카드 번호 순서) */
const STAMPS = [
  ['sinjeongho', 1048, 1265, '#e6338f'], ['onyang', 1121, 1047, '#f6c21c'], ['market', 913, 920, '#5cb54a'],
  ['museum', 1387, 967, '#4bb3e6'], ['gokgyo', 1126, 854, '#f39321'], ['hyeonchungsa', 1450, 746, '#1f4f9c'],
];
/* 상태별 지도 위치: [왼쪽, 위, 배율] */
const MAP_POS = { a: [610.5, 96.2, .41], b: [1008, 104, .40], c: [1018, 104, .40] };

function mimg(parent, id, x, y, w, cls) {
  const im = new Image();
  im.src = IMG[id]; im.alt = '';
  Object.assign(im.style, { left: x + 'px', top: y + 'px', width: w + 'px' });
  if (cls) im.className = cls;
  parent.appendChild(im);
  return im;
}
[[-20, 112, 230], [1700, 185, 240], [1395, 345, 260], [100, 468, 240], [59, 919, 258], [1580, 980, 230], [930, 230, 200]]
  .forEach(([x, y, w], i) => { mimg(mstage, 'map/cloud', x, y, w, 'cloud').style.animationDelay = (-i * 2.3) + 's'; });
[['map/f15', 248, 192, 257], ['map/f16', 128, 752, 311], ['map/f17', 1450, 150, 298], ['map/f18', 1527, 664, 384]]
  .forEach(([id, x, y, w], i) => { mimg(mstage, id, x, y, w, 'fade-char').style.animationDelay = (-i * 1.1) + 's'; });

const mgroup = document.createElement('div');
mgroup.id = 'mgroup';
mstage.appendChild(mgroup);
mimg(mgroup, 'map/map', 0, 0, 1895);
mimg(mgroup, 'map/line', 217, 1153, 1665.5);
const spotEl = {};
Object.entries(SPOTS).forEach(([k, [x, y, w]]) => {
  const el = mimg(mgroup, 'map/p_' + k, x, y, w, 'mi');
  if (k === 'market') el.classList.add('no-b');                 // 전통시장은 12선이 아님
  if (STAMPS.some(s => s[0] === k)) el.classList.add('stamp');
  spotEl[k] = el;
});
const route = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
route.setAttribute('class', 'route');
route.setAttribute('viewBox', '0 0 1895 2384');
route.innerHTML = `<defs><marker id="arw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ef4b2f"/></marker></defs>
  <path class="trail" d="M1010 1300 C860 1290 800 1110 850 960 S1010 780 1170 760 S1300 770 1340 800" marker-end="url(#arw)"/>
  <path class="trail" d="M1440 860 C1520 930 1540 1090 1480 1200 S1290 1300 1110 1300"/>`;
mgroup.appendChild(route);
const pinEl = {};
STAMPS.forEach(([k, x, y, color], i) => {
  const d = document.createElement('div');
  d.className = 'pin';
  Object.assign(d.style, { left: x + 'px', top: y + 'px', animationDelay: (i * .15) + 's' });
  d.innerHTML = `<svg viewBox="0 0 56 76"><path d="M28 74 C28 74 4 44 4 27 A24 24 0 1 1 52 27 C52 44 28 74 28 74 Z" fill="${color}" stroke="#fff" stroke-width="5"/><circle cx="28" cy="27" r="9" fill="#fff"/></svg>`;
  mgroup.appendChild(d);
  pinEl[k] = d;
});

const btn12 = mimg(mstage, 'map/btn_12', 63, 41, 278, 'mbtn');
const btnStamp = mimg(mstage, 'map/btn_stamp', 327, 31, 278, 'mbtn');
btn12.alt = '아산 관광 12선'; btnStamp.alt = '스탬프 투어';
btn12.addEventListener('click', () => setMode(mapPage.dataset.mode === 'b' ? 'a' : 'b'));
btnStamp.addEventListener('click', () => setMode(mapPage.dataset.mode === 'c' ? 'a' : 'c'));

function card(id, src, x, y, w, h) {
  const c = document.createElement('div');
  c.id = id; c.className = 'mcard';
  Object.assign(c.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  mimg(c, src, 0, 0, w);
  mstage.appendChild(c);
  return c;
}
function hotBox(parent, x, y, w, h) {   // 카드 안 좌표 (카드 왼쪽 위 기준)
  const d = document.createElement('div');
  d.className = 'hot';
  Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  parent.appendChild(d);
  return d;
}
// 관광 12선 카드의 4×3 타일 → 지도 위 그림. 타일 위치는 카드 그림에서 잰 값 (원본 픽셀 ÷ 3.447)
const GRID = ['gongseri', 'hyeonchungsa', 'pinnacle', 'spavis', 'sinjeongho', 'museum', 'yeonginsan', 'jijunghae', 'flower', 'bonggoksa', 'gokgyo', 'oeam'];
const card12 = card('card12', 'map/card_12', 220.6, 163.4, 666.7, 839);
GRID.forEach((k, i) => {
  // 색 네모 자체의 경계 (아래 그림자 제외) — 원본 픽셀 x 113/648/1181/1709, y 559/1091/1623, 한 변 474, 모서리 반지름 90
  const x = [32.8, 188.0, 342.6, 495.8][i % 4] + 1.2, y = [162.2, 316.5, 470.8][Math.floor(i / 4)] + 1.2, size = 137.5 - 2.4;
  const h = hotBox(card12, x, y, size, size - 2);   // 아래쪽 그림자가 비치지 않게 바닥은 조금 더 안쪽
  const z = document.createElement('div');
  z.className = 'zoom';
  Object.assign(z.style, { backgroundImage: `url("${IMG['map/card_12']}")`, backgroundSize: '666.7px auto', backgroundPosition: `${-x}px ${-y}px` });
  h.appendChild(z);
  h.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') highlight(k); });   // 반대로 지도 → 카드는 연결 안 함
  h.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') highlight(null); });
  h.addEventListener('click', e => {   // 휴대폰: 누르면 그 타일이 선택된 상태로
    if (lastPointer !== 'touch') return;
    e.stopPropagation();
    const on = !h.classList.contains('tap');
    card12.querySelectorAll('.hot.tap').forEach(t => t.classList.remove('tap'));
    h.classList.toggle('tap', on);
    highlight(on ? k : null);
  });
});
card('cardStamp', 'map/card_stamp', 204.7, 147, 664.9, 886);

mapPage.addEventListener('click', () => { card12.querySelectorAll('.hot.tap').forEach(t => t.classList.remove('tap')); highlight(null); });
function highlight(k) {
  Object.entries(spotEl).forEach(([key, el]) => el.classList.toggle('hl', key === k));
  Object.entries(pinEl).forEach(([key, el]) => el.classList.toggle('hl', key === k));
}
function setMode(m) {
  mapPage.dataset.mode = m;
  const [x, y, k] = MAP_POS[m];
  mgroup.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
  btn12.classList.toggle('on', m === 'b');
  btnStamp.classList.toggle('on', m === 'c');
  highlight(null);
}
function fitMap() {
  const { k, x, y } = fitBox();
  mstage.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
}
addEventListener('resize', fitMap);
fitMap();
setMode('a');

render();

/* 캐릭터 페이지 이미지는 메인 화면이 뜬 뒤 미리 풀어 둠 (눌렀을 때 바로 보이도록) */
const warm = [];
(window.requestIdleCallback || (f => setTimeout(f, 800)))(() => {
  Object.keys(IMG).filter(k => k.includes('/')).forEach((k, i) => setTimeout(() => {
    const im = new Image(); im.src = IMG[k]; im.decode?.().catch(() => {}); warm.push(im);
  }, i * 30));
});

/* ---- 전체화면 버튼 (마우스를 움직일 때만 잠깐 보임) ---- */
const fsBtn = document.getElementById('fsBtn');
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.style.display = 'none';
['L14', 'L13', 'L15', 'L16'].forEach(id => { const i = new Image(); i.src = IMG[id]; i.alt = ''; document.getElementById('rotateChars').appendChild(i); });
document.getElementById('rotateSkip').addEventListener('click', () => document.getElementById('rotate').classList.add('skip'));
let idle;
addEventListener('pointermove', () => {
  document.body.classList.add('awake');
  clearTimeout(idle);
  idle = setTimeout(() => document.body.classList.remove('awake'), 2500);
});
fsBtn.addEventListener('click', e => {
  e.stopPropagation();
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
});
